name: Mirror Claude repositories

on:
  push:
    branches:
      - mirror-bootstrap
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror upstream repositories into namespaced branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEST_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mirror_exact() {
            local src="$1"
            local dest_branch="$2"
            local workdir
            workdir="$(mktemp -d)"
            git clone "$src" "$workdir/repo"
            cd "$workdir/repo"
            git remote add destination "https://x-access-token:${GH_TOKEN}@github.com/${DEST_REPO}.git"
            git push --force destination "HEAD:refs/heads/${dest_branch}"
          }

          mirror_without_workflows() {
            local src="$1"
            local dest_branch="$2"
            local workdir
            workdir="$(mktemp -d)"
            git clone "$src" "$workdir/repo"
            cd "$workdir/repo"
            git remote add destination "https://x-access-token:${GH_TOKEN}@github.com/${DEST_REPO}.git"

            if [ -d .github/workflows ]; then
              rm -rf .github/workflows
              git add -A
              git commit -m "Mirror transport: workflows restored separately"
            fi

            git push --force destination "HEAD:refs/heads/${dest_branch}"
          }

          mirror_exact "https://github.com/asgeirtj/system_prompts_leaks.git" "mirror-system-prompts-leaks/main"
          mirror_without_workflows "https://github.com/simonw/claude-system-prompts.git" "mirror-claude-system-prompts/main"
