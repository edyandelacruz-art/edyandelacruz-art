services:
  ollama:
    image: ollama/ollama:latest
    container_name: goalmind-ollama
    restart: unless-stopped
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - goalmind_ollama:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  model-bootstrap:
    image: ollama/ollama:latest
    profiles: ['bootstrap']
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ['/bin/sh', '-lc']
    command: ['ollama pull qwen3:4b && ollama list']

volumes:
  goalmind_ollama:
